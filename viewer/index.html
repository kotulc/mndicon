<!doctype html>
<!-- mndicon viewer: dark/light page theme (dark default), Nextra-style H/S/L
     color sliders for primary (bg) and secondary (fg), preset swatches.
     One square card per composition template: light/dark favicon+icon panels
     on the left, that template's own layer controls (always visible, icon
     dropdown last) on the right. Clicking a template card selects it, which
     feeds its live-tuned ("flattened") icon into a trailing logo card — the
     final icon + title; rounded-rect primitives can be added on demand behind
     or among them, with the title's per-part controls listed below the canvas.
     Mask ids are made unique per injected svg copy so cutouts render in every
     instance. Tuned SVGs are serialized on save (favicons rasterized here). -->
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mndicon</title>
<style>
  :root {
    color-scheme: dark;
    font-family: Avenir, Montserrat, Corbel, 'Segoe UI', sans-serif;
    --pg: #101012;
    --pg-elev: #151518;
    --pg-card: #18181b;
    --pg-border: #2c2c32;
    --pg-text: #f4f4f5;
    --pg-muted: #8e8e98;
    --pg-line: rgba(255,255,255,.06);
    --pg-select: rgba(255,255,255,.06);
    --pg-focus: #e4e4e7;
    --radius: 10px;
    --control-h: 28px;
    --ident-w: 96px;
    --order-w: 44px;
  }
  html[data-theme=light] {
    color-scheme: light;
    --pg: #ececee;
    --pg-elev: #f6f6f7;
    --pg-card: #ffffff;
    --pg-border: #e2e2e6;
    --pg-text: #18181b;
    --pg-muted: #71717a;
    --pg-line: rgba(0,0,0,.06);
    --pg-select: rgba(0,0,0,.04);
    --pg-focus: #27272a;
  }
  * { box-sizing: border-box; margin: 0 }
  body {
    background:
      radial-gradient(ellipse 90% 45% at 50% -10%, rgba(255,255,255,.045), transparent 55%),
      var(--pg);
    color: var(--pg-text);
    min-height: 100vh;
  }
  html[data-theme=light] body {
    background:
      radial-gradient(ellipse 90% 45% at 50% -10%, rgba(0,0,0,.04), transparent 55%),
      var(--pg);
  }

  header {
    display: flex; flex-wrap: wrap; align-items: center; gap: 12px;
    padding: 14px 24px; background: color-mix(in srgb, var(--pg-elev) 88%, transparent);
    backdrop-filter: blur(10px); border-bottom: 1px solid var(--pg-line);
    position: sticky; top: 0; z-index: 10;
  }
  header h1 { font-size: 17px; font-weight: 650; letter-spacing: -0.02em; margin-right: auto }
  header h1 svg { height: 28px; display: block }
  header label { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--pg-muted) }
  header input[type=number] {
    width: 100px; height: var(--control-h); padding: 0 10px;
    border: 1px solid var(--pg-border); border-radius: 7px;
    background: var(--pg-card); color: var(--pg-text); font: inherit;
  }
  header button {
    height: var(--control-h); padding: 0 14px; border: 0; border-radius: 7px;
    background: var(--pg-text); color: var(--pg-card); font: inherit;
    font-size: 13px; font-weight: 600; cursor: pointer;
  }
  #theme-toggle { background: transparent; color: var(--pg-muted); border: 1px solid var(--pg-border) }
  #theme-toggle:hover { color: var(--pg-text); border-color: var(--pg-muted) }
  .swatch {
    width: 22px; height: 22px; border-radius: 50%; border: 2px solid transparent;
    cursor: pointer; padding: 0;
  }
  .swatch.active { border-color: var(--pg-focus) }

  #tuner {
    max-width: 1120px; margin: 20px auto 0; padding: 0 24px; font-size: 13px;
  }
  #tuner > .tuner-card {
    background: var(--pg-card); border: 1px solid var(--pg-border);
    border-radius: var(--radius); overflow: hidden;
  }
  /* Shared section title look: colors summary and the logo card head */
  #tuner > .tuner-card > summary,
  .card.logo .head {
    display: flex; align-items: center; gap: 10px;
    min-height: 44px; padding: 8px 14px; margin: 0;
    font-size: 11px; font-weight: 650; color: var(--pg-muted);
    text-transform: uppercase; letter-spacing: 0.08em;
  }
  #tuner > .tuner-card > summary {
    list-style: none; cursor: pointer; user-select: none; width: 100%;
  }
  #tuner > .tuner-card > summary::-webkit-details-marker { display: none }
  #tuner > .tuner-card > summary:hover { color: var(--pg-text); background: var(--pg-select) }
  #tuner > .tuner-card[open] > summary { border-bottom: 1px solid var(--pg-line) }
  #tuner > .tuner-card > summary .hint {
    margin-left: auto; font-size: 11px; font-weight: 500; letter-spacing: 0.02em;
    text-transform: none; color: var(--pg-muted); opacity: 0.7;
  }
  #tuner > .tuner-card[open] > summary .hint { display: none }
  #tuner #color-rows {
    background: transparent; border: 0; border-radius: 0;
  }

  /* Unified control row: [order] [identity] [fields] [actions] */
  .rows {
    background: var(--pg-card); border: 1px solid var(--pg-border);
    border-radius: var(--radius); overflow: hidden;
  }
  .row {
    display: grid;
    grid-template-columns: var(--order-w) var(--ident-w) 1fr auto;
    align-items: center; gap: 10px;
    padding: 8px 12px; min-height: 44px;
    border-top: 1px solid var(--pg-line);
  }
  .row:first-child { border-top: 0 }
  .row.selected {
    background: var(--pg-select);
    box-shadow: inset 2px 0 0 var(--pg-focus);
  }
  .row.add-row { grid-template-columns: 1fr; padding: 6px 12px }
  .row.add-row + .row.add-row { border-top: 0; padding-top: 0 }
  /* Color tuner has no reorder controls — drop the order column so titles flush left */
  #color-rows .row { grid-template-columns: var(--ident-w) 1fr auto }

  .order, .order-spacer {
    display: inline-flex; gap: 2px; width: var(--order-w); justify-content: flex-start;
  }
  .order button {
    width: 20px; height: 20px; padding: 0; border: 1px solid var(--pg-border);
    border-radius: 5px; background: transparent; color: var(--pg-muted);
    font: inherit; font-size: 11px; line-height: 1; cursor: pointer;
  }
  .order button:hover:not(:disabled) { color: var(--pg-text); border-color: var(--pg-muted) }
  .order button:disabled { opacity: 0.28; cursor: default }

  .ident {
    display: flex; align-items: center; gap: 8px; min-width: 0; height: var(--control-h);
    font-size: 12px; font-weight: 600; color: var(--pg-text);
  }
  .ident .thumb { width: 20px; height: 20px; flex-shrink: 0; color: var(--pg-text) }
  .row.cut-row .ident .thumb { color: var(--pg-muted); opacity: 0.85 }
  .ident .label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
  .ident .title-text {
    width: 100%; height: var(--control-h); padding: 0 8px; font: inherit; font-weight: 500;
    background: var(--pg); color: var(--pg-text); border: 1px solid var(--pg-border);
    border-radius: 6px;
  }
  .ident .title-text:focus { outline: none; border-color: var(--pg-focus) }

  .cut-badge {
    font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--pg-muted); border: 1px dashed var(--pg-border); border-radius: 4px;
    padding: 1px 5px; flex-shrink: 0;
  }
  .cut-hint { color: var(--pg-muted); font-size: 12px }

  .fields { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; min-width: 0 }
  .row label { display: flex; align-items: center; gap: 5px; color: var(--pg-muted); font-size: 12px }
  .row input[type=range] { width: 80px; accent-color: var(--pg-focus) }
  .row select, .row input[type=number] {
    height: 24px; font: inherit; font-size: 12px; padding: 0 6px; max-width: 140px;
    background: var(--pg); color: var(--pg-text); border: 1px solid var(--pg-border);
    border-radius: 5px;
  }
  .chip { width: 18px; height: 18px; border-radius: 5px; border: 1px solid var(--pg-border) }

  .ink-btn {
    width: 16px; height: 16px; padding: 0; border-radius: 4px; cursor: pointer;
    border: 1.5px solid var(--pg-border);
  }
  .ink-btn.active { border-color: var(--pg-focus) }
  .ink-btn[data-ink=bg] { background: var(--bg) }
  .ink-btn[data-ink=fg] { background: var(--fg) }
  .ink-btn[data-ink=ac] { background: var(--ac) }
  .ink-btn.ink-default {
    background: var(--pg-card); color: var(--pg-text);
    font-size: 9px; font-weight: 700; line-height: 13px; text-align: center;
  }
  .ink-btn.ink-default::before { content: "A" }
  .row input[type=color].title-color {
    width: 24px; height: 22px; padding: 0; border: 1px solid var(--pg-border);
    border-radius: 4px; background: transparent; cursor: pointer;
  }
  .row .color-default {
    width: 20px; height: 20px; padding: 0; border: 1.5px solid var(--pg-border);
    border-radius: 4px; background: var(--pg-card); color: var(--pg-text);
    font: inherit; font-size: 9px; font-weight: 700; line-height: 17px;
    text-align: center; cursor: pointer;
  }
  .row .color-default.active { border-color: var(--pg-focus) }

  .actions { display: flex; align-items: center; justify-content: flex-end; width: 28px }
  .actions .remove {
    width: 24px; height: 24px; padding: 0; border: 0; border-radius: 5px;
    background: transparent; color: var(--pg-muted); font: inherit; font-size: 16px;
    line-height: 1; cursor: pointer;
  }
  .actions .remove:hover { color: var(--pg-text); background: var(--pg-select) }

  .row.add-row button {
    width: 100%; height: 30px; padding: 0 10px; border: 1px dashed var(--pg-border);
    border-radius: 7px; background: transparent; color: var(--pg-muted);
    font: inherit; font-size: 12px; cursor: pointer; text-align: left;
  }
  .row.add-row button:hover { color: var(--pg-text); border-color: var(--pg-muted); background: var(--pg-select) }

  main { display: grid; gap: 18px; padding: 20px 24px 40px; max-width: 1120px; margin: 0 auto }

  .card {
    background: var(--pg-card); border: 1px solid var(--pg-border); border-radius: 12px;
    padding: 14px; cursor: pointer; transition: border-color .15s ease;
  }
  .card:hover { border-color: color-mix(in srgb, var(--pg-border) 40%, var(--pg-muted)) }
  .card.selected { border-color: var(--pg-focus) }
  .card.logo { cursor: default; padding: 0; overflow: hidden }
  .card.logo:hover { border-color: var(--pg-border) }
  .card .head {
    display: flex; align-items: center; margin-bottom: 12px;
    font-size: 12px; font-weight: 600; color: var(--pg-muted); letter-spacing: 0.01em;
  }
  .card.logo .head {
    margin-bottom: 0; border-bottom: 1px solid var(--pg-line);
  }
  .card.logo .panels, .card.logo > .rows { margin: 12px 14px 14px }
  .card.logo > .rows { margin-top: 0 }
  .card .save {
    margin-left: auto; height: var(--control-h); padding: 0 12px;
    border: 1px solid var(--pg-border); border-radius: 7px; background: transparent;
    color: var(--pg-text); font: inherit; font-size: 12px; font-weight: 600; cursor: pointer;
    text-transform: none; letter-spacing: 0;
  }
  .card .save:hover { border-color: var(--pg-muted) }

  .body { display: flex; gap: 16px }
  .canvas { display: flex; flex-direction: row; gap: 8px; flex-shrink: 0 }
  .controls { flex: 1; min-width: 0 }

  .panel {
    border-radius: 8px; padding: 12px; display: flex; align-items: center; gap: 12px;
  }
  .panel.light { background: #f7f7f8; border: 1px solid #e4e4e7; color: #18181b }
  .panel.dark  { background: #1c1c1f; border: 1px solid #33333a; color: #fafafa }
  .canvas .panel { flex-direction: column; width: 156px }
  .favs { display: flex; align-items: center; gap: 8px }
  .canvas .favs { flex-direction: row }
  .favs .f32 svg { width: 32px; height: 32px }
  .favs .f16 svg { width: 16px; height: 16px }
  .main { flex: 1; display: flex; justify-content: center; min-width: 0 }
  .main svg { height: 96px; max-width: 100%; cursor: grab }
  .active-drag { filter:
    drop-shadow(0 0 0.75px #f8fafc) drop-shadow(0 0 0.75px #f8fafc)
    drop-shadow(0 0 1.5px #52525b) drop-shadow(0 0 3px #a1a1aa) }
  html[data-theme=light] .active-drag { filter:
    drop-shadow(0 0 0.75px #18181b) drop-shadow(0 0 0.75px #18181b)
    drop-shadow(0 0 2px #71717a) }
  .active-drag:active { cursor: grabbing }

  .panels { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px }
  .panels .main svg { border: 1px dashed color-mix(in srgb, var(--pg-muted) 55%, transparent) }

  #status {
    position: fixed; bottom: 16px; right: 16px; background: var(--pg-card); color: var(--pg-text);
    border: 1px solid var(--pg-border); padding: 10px 14px; border-radius: 8px; font-size: 13px;
    display: none; box-shadow: 0 8px 24px rgba(0,0,0,.25);
  }

  @media (max-width: 820px) {
    .body { flex-direction: column }
    .canvas { justify-content: center }
    .row { grid-template-columns: var(--order-w) minmax(72px, 1fr); gap: 8px }
    #color-rows .row { grid-template-columns: var(--ident-w) 1fr }
    .row .fields { grid-column: 1 / -1 }
    .row .actions { grid-column: 2; justify-self: end }
    #color-rows .row .actions { grid-column: 2 }
  }
</style>
</head>
<body>
<header>
  <h1 id="brand">mndicon</h1>
  <label for="seed">seed</label>
  <input id="seed" type="number" placeholder="random">
  <button id="regen">Regenerate</button>
  <button id="theme-toggle" title="page theme">☀</button>
</header>
<div id="tuner">
  <details class="tuner-card">
    <summary>colors <span class="hint">click to expand</span></summary>
    <div class="rows" id="color-rows"></div>
  </details>
</div>
<main id="grid"></main>
<div id="status"></div>

<script>
let state = null                              // last /api payload
let selected = 0                              // index of the selected template card (feeds the logo card's icon)
let active = null                             // currently selected row/component: { kind: 'layer'|'logo'|'title', index?, role? }
// Colors as Nextra-style hue/saturation/lightness; primary = bg, secondary = fg, accent = ac
let current = { scheme: 'grey', fg: { h: 0, s: 0, l: 98 }, bg: { h: 240, s: 5, l: 34 }, ac: { h: 0, s: 0, l: 60 } }
const comps = {}                              // cand index -> role -> tuner state (incl. ink: 'fg'|'bg'|null)
const chosen = {}                             // cand index -> role -> icon name override
const layer_order = {}                        // cand index -> roles back-to-front (paint / control order)
const parts = []                              // text part -> { show, color, weight, scale, dx, typeset }
let title_texts = null                        // mutable text strings; null until first logo render
let title_laid_out = false                    // one-time real-width layout of initial text parts done?
// Logo-card-only components: flattened selected icon + text parts; primitives added on demand
const logo = {
  flat: { show: true, scale: 1, dx: 0, dy: 0 },
  width: 150, width_auto: true,  // canvas width: auto-fits icon+text until the user drags the slider
  // Paint / control order (back-to-front). textN = independent text parts; lprimN = primitives.
  // textN keys are inserted by ensure_title_state() from the composed title parts.
  stack: ['flat'],
}
let title_base = null                         // { x, y, ... } anchor from composed logo <text>

const WEIGHTS = [400, 500, 600, 700, 800]

async function api(url, body) {
  const res = await fetch(url, body ? { method: 'POST', body: JSON.stringify(body) } : {})
  const data = await res.json()
  if (!res.ok) throw new Error(data.error || res.statusText)
  return data
}

// --- Color helpers ---

function css_hsl(c) {
  return `hsl(${c.h} ${c.s}% ${c.l}%)`
}

const INK_FALLBACK = { fg: '#fafafa', bg: '#52525b', ac: '#000000' }

function ink_css(slot) {
  return `var(--${slot}, ${INK_FALLBACK[slot]})`
}

function parse_hsl(color) {
  // Parse an hsl(...) string or hex color into { h, s, l }
  const m = color.match(/hsl\((\d+)[ ,]+(\d+)%[ ,]+(\d+)%\)/)
  if (m) return { h: +m[1], s: +m[2], l: +m[3] }
  const n = parseInt(color.slice(1), 16)
  const r = (n >> 16 & 255) / 255, g = (n >> 8 & 255) / 255, b = (n & 255) / 255
  const max = Math.max(r, g, b), min = Math.min(r, g, b), d = max - min
  const l = (max + min) / 2
  if (!d) return { h: 0, s: 0, l: Math.round(l * 100) }
  const s = d / (1 - Math.abs(2 * l - 1))
  let h = max === r ? ((g - b) / d) % 6 : max === g ? (b - r) / d + 2 : (r - g) / d + 4
  return { h: Math.round(((h * 60) + 360) % 360), s: Math.round(s * 100), l: Math.round(l * 100) }
}

// --- Rendering ---

function instance(svg, n) {
  // Unique mask ids per injected copy: browsers resolve url(#id) document-wide
  // and fail to apply masks across separate inline svg fragments
  return svg.replace(/c(\d+)-cut(\d+)/g, `c$1-cut$2-i${n}`)
}

function render() {
  document.getElementById('seed').value = state.seed
  // Fresh compositions: drop any prior per-card layer order / added primitives
  // so roles are rediscovered from the new SVGs
  for (const k of Object.keys(layer_order)) delete layer_order[k]
  for (const idx of Object.keys(comps)) {
    for (const role of Object.keys(comps[idx])) {
      if (is_prim_role(role)) delete comps[idx][role]
    }
  }
  const grid = document.getElementById('grid')
  grid.innerHTML = ''
  state.candidates.forEach(cand => grid.appendChild(card(cand)))
  grid.appendChild(logo_card())
  select(Math.min(selected, state.candidates.length - 1))
}

function card(cand) {
  const el = document.createElement('div')
  el.className = 'card'
  el.dataset.index = cand.index
  el.innerHTML = `<div class="head">Option #${cand.index + 1} · Icon ${cand.template}</div>
    <div class="body">
      <div class="canvas">
        ${['light', 'dark'].map((mode, m) => `
          <div class="panel ${mode}">
            <div class="favs">
              <span class="f32">${instance(cand.svg_icon, m * 3)}</span>
              <span class="f16">${instance(cand.svg_icon, m * 3 + 1)}</span>
            </div>
            <div class="main">${instance(cand.svg_icon, m * 3 + 2)}</div>
          </div>`).join('')}
      </div>
      <div class="controls"><div class="rows"></div></div>
    </div>`
  el.onclick = () => select(cand.index)
  render_comp_rows(cand.index, el.querySelector('.rows'))

  // Re-apply any icon overrides chosen before this re-render
  for (const [role, name] of Object.entries(chosen[cand.index] || {})) swap_icon(el, role, name)
  return el
}

function select(index) {
  selected = index
  document.querySelectorAll('.card[data-index]').forEach(el => {
    el.classList.toggle('selected', +el.dataset.index === index)
  })
  apply()          // positions the newly-flattened icon + current title first...
  layout_text_parts() // ...space the initial text parts using their real widths...
  fit_logo_width() // ...so the measurement reflects the actual new content
  apply()          // ...then re-apply once more so the primitive sees the final width
}

function layout_text_parts() {
  // One-time initial layout: the per-part dx seeded in ensure_title_state() is a
  // crude character-count estimate that overlaps in proportional fonts. Once the
  // parts are actually rendered we can measure each and lay them out end-to-end.
  // Runs only until the user starts editing (guarded by title_laid_out).
  if (title_laid_out || !title_texts || !title_texts.length) return
  const base = read_title_base()
  const gap = (base['font-size'] || 42) * 0.28
  let x = 0
  for (let i = 0; i < title_texts.length; i++) {
    const el = document.querySelector(`#logo-card .panel.light [data-role="text${i}"]`)
    const p = parts[i]
    if (!el || !p) continue
    p.dx = x
    p.dy = 0
    x += el.getBBox().width + gap
  }
  title_laid_out = true
  apply()
}

function fit_logo_width() {
  // Recompute the auto-fit canvas width from current content. Called only at
  // settling points (template selection, initial load, regenerate) — never
  // from apply() itself, or the canvas would visibly resize while the user is
  // mid-drag/mid-tune. A no-op once the user has set a manual width override.
  if (!logo.width_auto) return
  const light_svg = document.querySelector('#logo-card .panel.light .main svg')
  if (!light_svg) return
  const box = light_svg.getBBox()
  logo.width = Math.max(120, Math.ceil(box.x + box.width + 8))
  const width_input = document.querySelector('#logo-card [data-k="width"]')
  if (width_input) width_input.value = logo.width
}

// --- Component row selection + click-and-drag positioning on the canvas ---

function select_active(row) {
  active = row.dataset.kind === 'layer' ? { kind: 'layer', index: +row.dataset.index, role: row.dataset.selRole }
         : row.dataset.kind === 'logo'  ? { kind: 'logo', role: row.dataset.selRole }
         : { kind: 'title', index: +row.dataset.index }
  document.querySelectorAll('.row.selected').forEach(r => r.classList.remove('selected'))
  row.classList.add('selected')
  apply()
}

function deselect() {
  active = null
  document.querySelectorAll('.row.selected').forEach(r => r.classList.remove('selected'))
  apply()
}

function owner_card_of(desc) {
  return desc.kind === 'layer' ? document.querySelector(`.card[data-index="${desc.index}"]`) : document.getElementById('logo-card')
}

function state_for(desc) {
  if (desc.kind === 'layer') return (comps[desc.index] || {})[desc.role]
  if (desc.kind === 'logo') return logo[desc.role]
  return parts[desc.index]
}

document.getElementById('grid').addEventListener('click', e => {
  // Selection happens ONLY via the control row, never by clicking the canvas:
  // components frequently overlap there, making click-to-select unreliable
  const row = e.target.closest('.row')
  if (row && row.dataset.kind) select_active(row)
})

document.addEventListener('click', e => {
  // Clicking outside the card that owns the current selection clears it. A
  // click on a selectable row is left alone here — the #grid listener above
  // already moved `active` to that new row, so re-checking it against the OLD
  // selection's owner card would be meaningless.
  if (!active || e.target.closest('.row[data-kind]')) return
  const owner = owner_card_of(active)
  if (!owner || !owner.contains(e.target)) deselect()
})

document.getElementById('grid').addEventListener('pointerdown', e => {
  // Dragging always targets whichever component is currently selected (via its
  // row), regardless of what shape is actually under the pointer — hit-testing
  // overlapping canvas shapes to pick a drag target is exactly what row-only
  // selection is meant to avoid. A click within a card that doesn't own the
  // active selection does nothing.
  const main = e.target.closest('.main')
  if (!main || !active) return
  const card = main.closest('.card')
  if (active.kind === 'layer' ? +card.dataset.index !== active.index : card.id !== 'logo-card') return

  const comp_state = state_for(active)
  if (!comp_state) return
  e.preventDefault()

  const svg = main.querySelector(':scope > svg')
  if (!svg) return
  const box = svg.getBoundingClientRect()
  const vb = svg.viewBox.baseVal
  const scale_x = (vb.width || 96) / box.width
  const scale_y = (vb.height || 96) / box.height
  const start = { x: e.clientX, y: e.clientY, dx: comp_state.dx, dy: comp_state.dy ?? 0 }
  // Logo components (icon, title, primitives) are unclamped so they can travel
  // the full canvas and clip past the viewBox edges. The flat icon is anchored
  // near x=48, so a half-width clamp left it unable to reach the right side.
  // Template-card layers stay on a 96×96 canvas; ±96 lets them fully exit it.
  const limit = active.kind === 'layer' ? { dx: 96, dy: 96 } : null
  const clamp = (v, max) => Math.max(-max, Math.min(max, v))

  function move(ev) {
    const ndx = start.dx + (ev.clientX - start.x) * scale_x
    const ndy = start.dy + (ev.clientY - start.y) * scale_y
    if (limit) {
      comp_state.dx = clamp(ndx, limit.dx)
      if ('dy' in comp_state) comp_state.dy = clamp(ndy, limit.dy)
    } else {
      comp_state.dx = ndx
      if ('dy' in comp_state) comp_state.dy = ndy
    }
    apply()
  }
  function up() {
    document.removeEventListener('pointermove', move)
    document.removeEventListener('pointerup', up)
  }
  document.addEventListener('pointermove', move)
  document.addEventListener('pointerup', up)
})

// --- Color rows (global, Nextra-style H/S/L per slot) ---

function render_color_rows() {
  const box = document.getElementById('color-rows')
  box.innerHTML = ''

  const theme_row = document.createElement('div')
  theme_row.className = 'row'
  theme_row.innerHTML = `${ident_label('themes')}<div class="fields"></div>${actions_spacer()}`
  const fields = theme_row.querySelector('.fields')
  state.schemes.forEach(scheme => {
    const btn = document.createElement('button')
    btn.className = 'swatch'
    btn.title = scheme.name
    btn.dataset.name = scheme.name
    btn.style.background = `linear-gradient(135deg, ${scheme.bg} 60%, ${scheme.fg} 60%)`
    btn.onclick = () => set_scheme(scheme)
    fields.appendChild(btn)
  })
  box.appendChild(theme_row)

  for (const [label, slot] of [['primary', 'bg'], ['secondary', 'fg'], ['accent', 'ac']]) {
    const c = current[slot]
    const row = document.createElement('div')
    row.className = 'row'
    row.dataset.slot = slot
    row.innerHTML = `${ident_label(label)}
      <div class="fields">
        <label>hue <input type="range" data-k="h" min="0" max="360" value="${c.h}"></label>
        <label>sat <input type="range" data-k="s" min="0" max="100" value="${c.s}"></label>
        <label>light <input type="range" data-k="l" min="0" max="100" value="${c.l}"></label>
        <span class="chip"></span>
      </div>${actions_spacer()}`
    row.querySelectorAll('input').forEach(input => {
      input.oninput = () => {
        current[slot][input.dataset.k] = +input.value
        current.scheme = 'custom'
        apply_colors()
      }
    })
    box.appendChild(row)
  }
  apply_colors()
}

function apply_colors() {
  // Set on body (not just #grid) so tuner ink swatches, a #grid sibling, can read them too
  document.body.style.setProperty('--fg', css_hsl(current.fg))
  document.body.style.setProperty('--bg', css_hsl(current.bg))
  document.body.style.setProperty('--ac', css_hsl(current.ac))
  document.querySelectorAll('#color-rows .row[data-slot]').forEach(row => {
    const c = current[row.dataset.slot]
    row.querySelectorAll('input').forEach(input => { input.value = c[input.dataset.k] })
    row.querySelector('.chip').style.background = css_hsl(c)
  })
  document.querySelectorAll('.swatch').forEach(s => {
    s.classList.toggle('active', s.dataset.name === current.scheme)
  })
}

function set_scheme(scheme) {
  // Presets only define primary/secondary; accent is independent and stays as-is
  current = { scheme: scheme.name, fg: parse_hsl(scheme.fg), bg: parse_hsl(scheme.bg), ac: current.ac }
  apply_colors()
}

// --- Shared row controls (icon layers, logo components, and title parts all use this) ---

function ink_html({ allowDefault = false } = {}) {
  // Swatches: optional panel-contrast (currentColor), then primary/secondary/accent
  return `<label>color
    ${allowDefault ? `<button type="button" class="ink-btn ink-default" data-ink="" title="panel contrast"></button>` : ''}
    <button type="button" class="ink-btn" data-ink="bg" title="primary"></button>
    <button type="button" class="ink-btn" data-ink="fg" title="secondary"></button>
    <button type="button" class="ink-btn" data-ink="ac" title="accent"></button>
  </label>`
}

function wire_row(row, s, handlers = {}) {
  // Standard inputs write straight into state s; string-valued selects (icon,
  // typeset) and the ink swatches go through explicit handlers/state.ink instead
  row.querySelectorAll('input, select').forEach(input => {
    const k = input.dataset.k
    if (k === 'icon' || k === 'typeset') { input.onchange = () => handlers[k](input.value); return }
    if (input.classList.contains('title-text') || input.classList.contains('title-color')) return
    input.oninput = () => {
      s[k] = input.type === 'checkbox' ? input.checked : +input.value
      apply()
    }
  })
  row.querySelectorAll('.ink-btn').forEach(btn => {
    const btn_ink = btn.dataset.ink || null
    btn.classList.toggle('active', (s.ink || null) === btn_ink)
    btn.onclick = () => {
      s.ink = btn.dataset.ink || null
      row.querySelectorAll('.ink-btn').forEach(b => {
        b.classList.toggle('active', (s.ink || null) === (b.dataset.ink || null))
      })
      apply()
    }
  })
}

function fill_for_ink(ink) {
  // null/undefined → panel text color (contrasts on light and dark canvases)
  return ink ? ink_css(ink) : 'currentColor'
}

// --- Per-template icon layer controls (always visible, follow their own card) ---

function order_html(at_start, at_end) {
  // ↑↓ swap this row with its neighbor in the back-to-front list (↓ = toward front)
  return `<span class="order">
    <button type="button" data-dir="-1" title="Move back" ${at_start ? 'disabled' : ''}>↑</button>
    <button type="button" data-dir="1" title="Move forward" ${at_end ? 'disabled' : ''}>↓</button>
  </span>`
}

function order_spacer() {
  return `<span class="order-spacer" aria-hidden="true"></span>`
}

function ident_label(text) {
  return `<div class="ident"><span class="label">${text}</span></div>`
}

function ident_thumb(inner, attrs = '') {
  return `<div class="ident"><svg class="thumb" viewBox="0 0 16 16" fill="currentColor" ${attrs}>${inner}</svg></div>`
}

function actions_html(title = 'Remove') {
  return `<div class="actions"><button type="button" class="remove" title="${title}">×</button></div>`
}

function actions_spacer() {
  return `<div class="actions" aria-hidden="true"></div>`
}

function wire_order(row, on_move) {
  row.querySelectorAll('.order button').forEach(btn => {
    btn.onclick = e => {
      e.stopPropagation()
      if (btn.disabled) return
      on_move(+btn.dataset.dir)
    }
  })
}

function wire_remove(row, on_remove) {
  const btn = row.querySelector('.actions .remove')
  if (!btn) return
  btn.onclick = e => {
    e.stopPropagation()
    on_remove()
  }
}

function prim_thumb_svg() {
  return `<rect x="1.5" y="1.5" width="13" height="13" rx="3"/>`
}

function swap_adjacent(list, i, dir) {
  const j = i + dir
  if (i < 0 || j < 0 || j >= list.length) return false
  ;[list[i], list[j]] = [list[j], list[i]]
  return true
}

function roles_for(index, card_el) {
  // Lazily capture the composed SVG's role order (back-to-front) once per card
  if (!layer_order[index]) {
    const el = card_el || document.querySelector(`.card[data-index="${index}"]`)
    layer_order[index] = [...new Set([...el.querySelectorAll('[data-role]')].map(n => n.dataset.role))]
  }
  return layer_order[index]
}

function stack_node_for(svg, role) {
  // The body node whose sibling order controls paint order for this role.
  // Cut layers live inside <mask> defs — their visual effect is on the
  // [data-masked-by] wrapper, so that wrapper is the stack unit (shared with
  // the painted target role inside it).
  const el = svg.querySelector(`[data-role="${role}"]`)
  if (!el) return null
  const mask = el.closest('mask')
  if (mask) return svg.querySelector(`[data-masked-by="${mask.id}"]`)
  return el.closest('[data-masked-by]') || el
}

function reorder_icon_dom(index) {
  // Re-append unique stack nodes in layer_order so SVG paint matches controls
  const order = roles_for(index)
  const card = document.querySelector(`.card[data-index="${index}"]`)
  for (const svg of card.querySelectorAll('.canvas svg')) {
    const seen = new Set()
    for (const role of order) {
      const node = stack_node_for(svg, role)
      if (node && node.parentNode === svg && !seen.has(node)) {
        seen.add(node)
        svg.appendChild(node)
      }
    }
  }
}

function is_prim_role(role) {
  return /^iprim\d+$/.test(role)
}

function is_logo_prim_role(role) {
  return /^lprim\d+$/.test(role)
}

function prim_markup(role) {
  // Rounded rect that doubles as a circle at high rx; role is unique per add
  return `<rect data-role="${role}" x="0" y="0" width="96" height="96" rx="14" fill="var(--bg, #52525b)"/>`
}

function next_prim_role(index) {
  const used = new Set(roles_for(index))
  let n = 0
  while (used.has(`iprim${n}`)) n++
  return `iprim${n}`
}

function inject_icon_primitive(index, role) {
  const card = document.querySelector(`.card[data-index="${index}"]`)
  const html = prim_markup(role)
  for (const svg of card.querySelectorAll('.canvas svg')) {
    svg.insertAdjacentHTML('beforeend', html)
  }
}

function add_icon_primitive(index) {
  const role = next_prim_role(index)
  const order = roles_for(index)
  order.push(role)  // new primitives paint on top (end of back-to-front list)
  const c = comps[index] || (comps[index] = {})
  c[role] = { show: true, ink: 'bg', w: 1, h: 1, rx: 14, dx: 0, dy: 0 }
  inject_icon_primitive(index, role)
  const container = document.querySelector(`.card[data-index="${index}"] .controls .rows`)
  render_comp_rows(index, container)
  const row = container.querySelector(`.row[data-sel-role="${role}"]`)
  if (row) select_active(row)
  else apply()
}

function remove_icon_primitive(index, role) {
  const order = roles_for(index)
  const i = order.indexOf(role)
  if (i >= 0) order.splice(i, 1)
  if (comps[index]) delete comps[index][role]
  const card = document.querySelector(`.card[data-index="${index}"]`)
  card.querySelectorAll(`[data-role="${role}"]`).forEach(el => el.remove())
  if (active?.kind === 'layer' && active.index === index && active.role === role) deselect()
  const container = card.querySelector('.controls .rows')
  render_comp_rows(index, container)
  apply()
}

function apply_icon_primitive(el, c, index, role) {
  // Icon canvas is always 96×96; w/h are fractions of that edge (same as logo prim)
  el.style.display = c.show ? '' : 'none'
  if (c.ink !== undefined) el.setAttribute('fill', fill_for_ink(c.ink))
  const w = 96 * c.w, h = 96 * c.h
  el.setAttribute('width', w); el.setAttribute('height', h)
  el.setAttribute('x', (96 - w) / 2 + c.dx); el.setAttribute('y', (96 - h) / 2 + c.dy)
  el.setAttribute('rx', c.rx)
  el.classList.toggle('active-drag', !!el.closest('.main') &&
    active?.kind === 'layer' && active.index === index && active.role === role)
}

function render_prim_row(index, role, ri, roles, container) {
  const bag = comps[index] || (comps[index] = {})
  if (!bag[role]) bag[role] = { show: true, ink: 'bg', w: 1, h: 1, rx: 14, dx: 0, dy: 0 }
  const c = bag[role]
  const row = document.createElement('div')
  row.className = 'row'
  row.dataset.kind = 'layer'
  row.dataset.index = index
  row.dataset.selRole = role
  row.innerHTML = `${order_html(ri === 0, ri === roles.length - 1)}
    ${ident_thumb(prim_thumb_svg())}
    <div class="fields">
      <label>show <input type="checkbox" data-k="show" ${c.show ? 'checked' : ''}></label>
      <label>width <input type="range" data-k="w" min="0.1" max="1.5" step="0.05" value="${c.w}"></label>
      <label>height <input type="range" data-k="h" min="0.1" max="1.5" step="0.05" value="${c.h}"></label>
      ${ink_html({ allowDefault: true })}
      <label>round <input type="range" data-k="rx" min="0" max="48" value="${c.rx}"></label>
    </div>
    ${actions_html('Remove primitive')}`
  wire_row(row, c)
  wire_order(row, dir => move_icon_layer(index, role, dir))
  wire_remove(row, () => remove_icon_primitive(index, role))
  container.appendChild(row)
}

function move_icon_layer(index, role, dir) {
  const order = roles_for(index)
  if (!swap_adjacent(order, order.indexOf(role), dir)) return
  reorder_icon_dom(index)
  const container = document.querySelector(`.card[data-index="${index}"] .controls .rows`)
  render_comp_rows(index, container)
  const row = container.querySelector(`.row[data-sel-role="${role}"]`)
  if (row) select_active(row)
  else apply()
}

function comp_state(index, role, init) {
  const c = comps[index] || (comps[index] = {})
  if (!c[role]) c[role] = { show: true, ink: 'bg', scale: 1, dx: 0, dy: 0, ...init }
  return c[role]
}

function render_comp_rows(index, container) {
  // Roles follow layer_order (initially the composed SVG's document order) —
  // never a hardcoded list, so adding/removing/renaming roles needs no viewer change
  const cand = state.candidates[index]
  const card_el = container.closest('.card')
  const roles = roles_for(index, card_el)
  container.innerHTML = ''

  roles.forEach((role, ri) => {
    if (is_prim_role(role)) {
      render_prim_row(index, role, ri, roles, container)
      return
    }
    // A cut (subtractive mask) layer has no fill of its own (raw #000 inside its
    // <mask>) and gets no color control; painted layers carry fill="var(--fg/bg)"
    const fill = card_el.querySelector(`[data-role="${role}"]`).getAttribute('fill') || ''
    const paintable = fill.startsWith('var(')
    const c = comp_state(index, role, { ink: paintable ? (fill.includes('--fg') ? 'fg' : 'bg') : null })
    const name = (chosen[index] || {})[role] || cand.icons[role]
    const row = document.createElement('div')
    row.className = 'row' + (paintable ? '' : ' cut-row')
    row.dataset.kind = 'layer'
    row.dataset.index = index
    row.dataset.selRole = role
    row.innerHTML = `${order_html(ri === 0, ri === roles.length - 1)}
      ${ident_thumb(state.icon_bodies[name], `data-thumb="${role}"`)}
      <div class="fields">
        ${paintable ? '' : `<span class="cut-badge" title="Subtractive mask — punches through the layer below">cut</span>`}
        <label>show <input type="checkbox" data-k="show" ${c.show ? 'checked' : ''}></label>
        <label>size <input type="range" data-k="scale" min="0.25" max="1.75" step="0.05" value="${c.scale}"></label>
        <label>icon <select data-k="icon">
          ${state.icon_roles[role].map(n => `<option ${n === ((chosen[index] || {})[role] || cand.icons[role]) ? 'selected' : ''}>${n}</option>`).join('')}
        </select></label>
        ${paintable ? ink_html({ allowDefault: true }) : `<span class="cut-hint">subtracts from layer below</span>`}
      </div>
      ${actions_spacer()}`
    wire_row(row, c, { icon: name => set_icon(index, role, name) })
    wire_order(row, dir => move_icon_layer(index, role, dir))
    container.appendChild(row)
  })

  const add = document.createElement('div')
  add.className = 'row add-row'
  add.innerHTML = `<button type="button">+ primitive</button>`
  add.querySelector('button').onclick = e => {
    e.stopPropagation()
    add_icon_primitive(index)
  }
  container.appendChild(add)
}

function set_icon(index, role, name) {
  (chosen[index] || (chosen[index] = {}))[role] = name
  const card_el = document.querySelector(`.card[data-index="${index}"]`)
  swap_icon(card_el, role, name)
  const thumb = card_el.querySelector(`[data-thumb="${role}"]`)
  if (thumb) thumb.innerHTML = state.icon_bodies[name]
  apply()
}

function swap_icon(el, role, name) {
  // Swap the icon markup in every copy of the layer (incl. inside cutout masks)
  el.querySelectorAll(`g[data-role="${role}"]`).forEach(g => { g.innerHTML = state.icon_bodies[name] })
}

// --- Text part controls (independent absolutely-positioned <text> elements) ---

function is_text_role(role) {
  return /^text\d+$/.test(role)
}

function esc_xml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
}

function esc_attr(s) {
  return esc_xml(s).replace(/"/g, '&quot;')
}

function read_title_base() {
  if (title_base) return title_base
  const doc = new DOMParser().parseFromString(state.candidates[0].svg_logo, 'image/svg+xml')
  const t = doc.querySelector('[data-role="title"]')
  title_base = {
    x: +t.getAttribute('x'),
    y: +t.getAttribute('y'),
    'dominant-baseline': t.getAttribute('dominant-baseline'),
    'font-family': t.getAttribute('font-family'),
    'font-weight': t.getAttribute('font-weight'),
    'font-size': +t.getAttribute('font-size'),
  }
  return title_base
}

function sync_text_stack_keys() {
  // Initial seed only: append text0..textN-1 after flat (once). Add/remove
  // mutate the stack in place so interleaved z-order with icon/primitives is kept.
  if (logo.stack.some(is_text_role)) return
  title_texts.forEach((_, i) => logo.stack.push(`text${i}`))
}

function ensure_title_state() {
  // Own a mutable copy of the composed title strings; each part gets its own
  // absolute dx/dy so dragging one never pulls the others (they used to share
  // one <text> with relative tspan offsets, which linked them).
  if (title_texts) return
  title_texts = [...state.title_parts]
  const sep = state.sep ?? ' '
  const size = read_title_base()['font-size'] || 42
  let x = 0
  title_texts.forEach((text, i) => {
    parts[i] = { ...default_part_state(), dx: x, dy: 0 }
    // Rough advance so the initial layout still reads left-to-right like compose
    x += (String(text).length + (i < title_texts.length - 1 ? sep.length : 0)) * size * 0.55
  })
  sync_text_stack_keys()
}

function default_part_state() {
  // color null = panel currentColor (guaranteed contrast on light/dark canvases)
  return { show: true, color: null, weight: 600, bold: false, scale: 1, dx: 0, dy: 0, typeset: 'geometric' }
}

function add_title_part() {
  ensure_title_state()
  const prev = parts[parts.length - 1]
  const p = { ...default_part_state(), dx: (prev?.dx || 0) + 48, dy: prev?.dy || 0 }
  title_texts.push('text')
  parts.push(p)
  logo.stack.push(`text${title_texts.length - 1}`)
  const rows = document.querySelector('#logo-card .rows')
  render_logo_rows(rows)
  const row = rows.querySelector(`.row[data-kind="title"][data-index="${title_texts.length - 1}"]`)
  if (row) select_active(row)
  else apply()
}

function remove_title_part(i) {
  ensure_title_state()
  if (i < 0 || i >= title_texts.length) return
  title_texts.splice(i, 1)
  parts.splice(i, 1)
  logo.stack = logo.stack
    .filter(k => k !== `text${i}`)
    .map(k => {
      if (!is_text_role(k)) return k
      const n = +k.slice(4)
      return n > i ? `text${n - 1}` : k
    })
  if (active?.kind === 'title') {
    if (active.index === i) deselect()
    else if (active.index > i) active = { kind: 'title', index: active.index - 1 }
  }
  const rows = document.querySelector('#logo-card .rows')
  render_logo_rows(rows)
  apply()
}

function text_markup(i) {
  // One absolute <text> per part — siblings in the logo SVG, independently movable
  ensure_title_state()
  const base = read_title_base()
  const p = parts[i] || default_part_state()
  return `<text data-role="text${i}" data-part="${i}" ` +
         `x="${base.x + p.dx}" y="${base.y + p.dy}" ` +
         `dominant-baseline="${base['dominant-baseline']}" ` +
         `font-family="${esc_attr(base['font-family'])}" font-weight="${base['font-weight']}" ` +
         `font-size="${base['font-size']}" fill="currentColor">${esc_xml(title_texts[i] ?? '')}</text>`
}

function render_text_row(container, i, si, stack_len) {
  ensure_title_state()
  const text = title_texts[i] ?? ''
  const p = parts[i] || (parts[i] = default_part_state())
  const row = document.createElement('div')
  row.className = 'row'
  row.dataset.kind = 'title'
  row.dataset.index = i
  row.innerHTML = `${order_html(si === 0, si === stack_len - 1)}
    <div class="ident"><input type="text" class="title-text" value="${esc_attr(text)}" aria-label="Text"></div>
    <div class="fields">
      <label>show <input type="checkbox" data-k="show" ${p.show ? 'checked' : ''}></label>
      <label>size <input type="range" data-k="scale" min="0.4" max="1.6" step="0.05" value="${p.scale}"></label>
      <label>weight <select data-k="weight">
        ${WEIGHTS.map(w => `<option ${w === p.weight ? 'selected' : ''}>${w}</option>`).join('')}
      </select></label>
      <label>bold <input type="checkbox" data-k="bold" ${p.bold ? 'checked' : ''}></label>
      <label>typeset <select data-k="typeset">
        ${Object.keys(state.typesets).map(t => `<option ${t === p.typeset ? 'selected' : ''}>${t}</option>`).join('')}
      </select></label>
      <label>color
        <input type="color" class="title-color" value="${p.color || '#71717a'}" title="Custom color">
        <button type="button" class="color-default ${p.color ? '' : 'active'}" title="Default (panel contrast)">A</button>
      </label>
    </div>
    ${actions_html('Remove text')}`
  wire_row(row, p, { typeset: t => { p.typeset = t; apply() } })
  row.querySelector('.title-text').oninput = e => {
    title_texts[i] = e.target.value
    apply()
  }
  const color_input = row.querySelector('.title-color')
  const color_default = row.querySelector('.color-default')
  color_input.oninput = () => {
    p.color = color_input.value
    color_default.classList.remove('active')
    apply()
  }
  color_default.onclick = e => {
    e.stopPropagation()
    p.color = null
    color_default.classList.add('active')
    apply()
  }
  wire_remove(row, () => remove_title_part(i))
  wire_order(row, dir => move_logo_layer(`text${i}`, dir))
  container.appendChild(row)
}

// --- Logo card: flattened selected icon + optional bg shapes + title, all controls below ---

function next_logo_prim_role() {
  let n = 0
  while (logo.stack.includes(`lprim${n}`)) n++
  return `lprim${n}`
}

function add_logo_primitive() {
  const role = next_logo_prim_role()
  logo[role] = { show: true, ink: 'bg', w: 1, h: 1, rx: 14, dx: 0, dy: 0 }
  logo.stack.push(role)  // new primitives paint on top
  const rows = document.querySelector('#logo-card .rows')
  render_logo_rows(rows)
  const row = rows.querySelector(`.row[data-kind="logo"][data-sel-role="${role}"]`)
  if (row) select_active(row)
  else apply()
}

function remove_logo_primitive(role) {
  const i = logo.stack.indexOf(role)
  if (i >= 0) logo.stack.splice(i, 1)
  delete logo[role]
  if (active?.kind === 'logo' && active.role === role) deselect()
  const rows = document.querySelector('#logo-card .rows')
  render_logo_rows(rows)
  apply()
}

function move_logo_layer(key, dir) {
  if (!swap_adjacent(logo.stack, logo.stack.indexOf(key), dir)) return
  const rows = document.querySelector('#logo-card .rows')
  render_logo_rows(rows)
  const row = is_text_role(key)
    ? rows.querySelector(`.row[data-kind="title"][data-index="${key.slice(4)}"]`)
    : rows.querySelector(`.row[data-kind="logo"][data-sel-role="${key}"]`)
  if (row) select_active(row)
  else apply()
}

function render_logo_rows(rows) {
  ensure_title_state()
  // Canvas width stays pinned first; visual layers follow logo.stack (back-to-front)
  const keep_active = active && (active.kind === 'logo' || active.kind === 'title') ? { ...active } : null
  rows.innerHTML = ''

  const width_row = document.createElement('div')
  width_row.className = 'row'
  width_row.innerHTML = `${order_spacer()}${ident_label('canvas')}
    <div class="fields">
      <label>width <input type="range" data-k="width" min="120" max="700" step="10" value="${logo.width}"></label>
    </div>${actions_spacer()}`
  width_row.querySelector('input').oninput = e => {
    logo.width_auto = false
    logo.width = +e.target.value
    apply()
  }
  rows.appendChild(width_row)

  logo.stack.forEach((key, si) => {
    if (is_text_role(key)) {
      render_text_row(rows, +key.slice(4), si, logo.stack.length)
      return
    }
    const c = logo[key]
    const row = document.createElement('div')
    row.className = 'row'
    row.dataset.kind = 'logo'
    row.dataset.selRole = key
    if (key === 'flat') {
      row.innerHTML = `${order_html(si === 0, si === logo.stack.length - 1)}
        ${ident_label('icon')}
        <div class="fields">
          <label>show <input type="checkbox" data-k="show" ${c.show ? 'checked' : ''}></label>
          <label>size <input type="range" data-k="scale" min="0.25" max="1.75" step="0.05" value="${c.scale}"></label>
        </div>
        ${actions_spacer()}`
    } else if (is_logo_prim_role(key)) {
      row.innerHTML = `${order_html(si === 0, si === logo.stack.length - 1)}
        ${ident_thumb(prim_thumb_svg())}
        <div class="fields">
          <label>show <input type="checkbox" data-k="show" ${c.show ? 'checked' : ''}></label>
          <label>width <input type="range" data-k="w" min="0.1" max="1.5" step="0.05" value="${c.w}"></label>
          <label>height <input type="range" data-k="h" min="0.1" max="1.5" step="0.05" value="${c.h}"></label>
          ${ink_html({ allowDefault: true })}
          <label>round <input type="range" data-k="rx" min="0" max="48" value="${c.rx}"></label>
        </div>
        ${actions_html('Remove primitive')}`
    }
    wire_row(row, c)
    wire_order(row, dir => move_logo_layer(key, dir))
    if (is_logo_prim_role(key)) wire_remove(row, () => remove_logo_primitive(key))
    rows.appendChild(row)
  })

  const add_text = document.createElement('div')
  add_text.className = 'row add-row'
  add_text.innerHTML = `<button type="button">+ text</button>`
  add_text.querySelector('button').onclick = e => {
    e.stopPropagation()
    add_title_part()
  }
  rows.appendChild(add_text)

  const add_prim = document.createElement('div')
  add_prim.className = 'row add-row'
  add_prim.innerHTML = `<button type="button">+ primitive</button>`
  add_prim.querySelector('button').onclick = e => {
    e.stopPropagation()
    add_logo_primitive()
  }
  rows.appendChild(add_prim)

  if (keep_active) {
    const row = keep_active.kind === 'title'
      ? rows.querySelector(`.row[data-kind="title"][data-index="${keep_active.index}"]`)
      : rows.querySelector(`.row[data-kind="logo"][data-sel-role="${keep_active.role}"]`)
    if (row) row.classList.add('selected')
  }
}

function logo_card() {
  const el = document.createElement('div')
  el.className = 'card logo'
  el.id = 'logo-card'
  el.innerHTML = `<div class="head">logo <button class="save">Save</button></div>
    <div class="panels">
      <div class="panel light"><div class="main"></div></div>
      <div class="panel dark"><div class="main"></div></div>
    </div>
    <div class="rows"></div>`
  el.querySelector('.save').onclick = save_logo
  render_logo_rows(el.querySelector('.rows'))
  return el
}

function rebuild_logo_dom() {
  ensure_title_state()
  const logo_card_el = document.getElementById('logo-card')
  const src = document.querySelector(`.card[data-index="${selected}"] .panel.light .main svg`)
  if (!logo_card_el || !src) return

  // Pieces assembled in logo.stack order (back-to-front)
  const frozen = src.innerHTML.replace(/\s*class="active-drag"/g, '')
  const pieces = {
    // Phase 1 may have marked a source layer with active-drag — strip it so
    // editor-only UI state never leaks into the frozen flattened snapshot
    flat: `<svg data-role="flat" x="0" y="0" width="96" height="96" viewBox="0 0 96 96">${frozen}</svg>`,
  }
  for (const key of logo.stack) {
    if (is_text_role(key)) pieces[key] = text_markup(+key.slice(4))
    else if (is_logo_prim_role(key)) pieces[key] = prim_markup(key)
  }
  // Placeholder width only: apply() immediately recomputes it from actual rendered
  // content (or the user's manual override) before anything is shown on screen
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${logo.width} 96">` +
              `${logo.stack.map(k => pieces[k]).join('')}</svg>`

  logo_card_el.querySelector('.panel.light .main').innerHTML = instance(svg, 100)
  logo_card_el.querySelector('.panel.dark .main').innerHTML = instance(svg, 101)
}

// --- Apply tuner state to every card's live SVG DOM ---

function apply() {
  // Phase 1: finalize every template card's own layer transforms first, so the
  // logo card (phase 2) flattens an already-up-to-date source, never a stale
  // one-cycle-behind copy of the selected card
  for (const card of document.querySelectorAll('.card[data-index]')) {
    const index = +card.dataset.index
    for (const el of card.querySelectorAll('[data-role]')) {
      const role = el.dataset.role
      const c = (comps[index] || {})[role]
      if (!c) continue

      if (is_prim_role(role)) {
        apply_icon_primitive(el, c, index, role)
        continue
      }

      const mask_el = el.closest('mask')
      if (mask_el) {
        // Cut (subtractive) layer: toggle whether the mask is APPLIED to its
        // target rather than the layer's own display. Some browsers are slow
        // to repaint a <mask> when only its content's display changes; adding
        // or removing the mask attribute on the (unmasked) target repaints
        // reliably. data-masked-by is a stable marker (never removed) so the
        // target is always findable even once its mask attribute is gone.
        // Cut shapes stay fill="#000" inside the mask — never retinted.
        const target = el.closest('svg').querySelector(`[data-masked-by="${mask_el.id}"]`)
        if (target) {
          if (c.show) target.setAttribute('mask', `url(#${mask_el.id})`)
          else target.removeAttribute('mask')
        }
      } else {
        el.style.display = c.show ? '' : 'none'
        if (c.ink !== undefined) el.setAttribute('fill', fill_for_ink(c.ink))
      }

      const size = +el.dataset.size * c.scale
      el.setAttribute('transform', `translate(${48 + +el.dataset.dx + c.dx - size * 48} ` +
                                   `${48 + c.dy - size * 48}) scale(${size * 6})`)
      el.classList.toggle('active-drag', !!el.closest('.main') &&
        active?.kind === 'layer' && active.index === index && active.role === role)
    }
  }

  // Phase 2: rebuild the logo card from the now-current selection, then tune
  // its own components in three passes, because logo-primitive sizing needs the
  // FINAL canvas width and that width (in auto mode) is measured from the
  // already-tuned icon+title — so it can't all happen in one pass:
  //   1. title + flat icon (their geometry never depends on canvas width);
  //      logo primitives are force-hidden here so they can't skew the measurement
  //   2. measure the tuned content and fix the canvas width (auto-fit or the
  //      user's manual override), sized generously enough that nothing clips
  //   3. logo primitives, whose width-relative sizing can now read a true value
  rebuild_logo_dom()
  const logo_el = document.getElementById('logo-card')

  // Force-hide logo lprim* so they can't skew the width measurement below;
  // top-level only — iprim* inside the flattened icon keep phase-1 geometry
  for (const el of logo_el.querySelectorAll('.main > svg > [data-role^="lprim"]')) el.style.display = 'none'
  for (const el of logo_el.querySelectorAll('.main > svg > [data-role^="text"]')) apply_text_part(el)
  for (const el of logo_el.querySelectorAll('svg[data-role="flat"]')) {
    const c = logo.flat
    el.style.display = c.show ? '' : 'none'
    const w = 96 * c.scale
    el.setAttribute('width', w); el.setAttribute('height', w)
    el.setAttribute('x', 48 + c.dx - w / 2); el.setAttribute('y', 48 + c.dy - w / 2)
    el.classList.toggle('active-drag', active?.kind === 'logo' && active.role === 'flat')
  }

  // logo.width is applied as-is here — it is NOT re-measured on every apply()
  // cycle. Continuously re-fitting to content would visibly resize the canvas
  // while the user drags or tunes a title/icon position; fit_logo_width()
  // instead recomputes it only at settling points (template selection, load,
  // regenerate), called explicitly from select().
  const light_svg = logo_el.querySelector('.panel.light .main svg')
  const dark_svg  = logo_el.querySelector('.panel.dark .main svg')
  if (light_svg && dark_svg) {
    light_svg.setAttribute('viewBox', `0 0 ${logo.width} 96`)
    dark_svg.setAttribute('viewBox', `0 0 ${logo.width} 96`)
  }

  for (const el of logo_el.querySelectorAll('.main > svg > [data-role^="lprim"]')) {
    const c = logo[el.dataset.role]
    if (!c) continue
    el.style.display = c.show ? '' : 'none'
    if (c.ink !== undefined) el.setAttribute('fill', fill_for_ink(c.ink))
    const vbw = el.ownerSVGElement.viewBox.baseVal.width
    const w = vbw * c.w, h = 96 * c.h
    el.setAttribute('width', w); el.setAttribute('height', h)
    el.setAttribute('x', (vbw - w) / 2 + c.dx); el.setAttribute('y', (96 - h) / 2 + c.dy)
    el.setAttribute('rx', c.rx)
    el.classList.toggle('active-drag', active?.kind === 'logo' && active.role === el.dataset.role)
  }
}

function apply_text_part(el) {
  // Each text part is its own <text> with absolute x/y (base + dx/dy), so parts
  // move independently — unlike the old shared-<text>/relative-tspan setup.
  const i = +el.dataset.part
  const p = parts[i]
  if (!p) return
  const base = read_title_base()
  el.style.display = p.show ? '' : 'none'
  el.textContent = title_texts[i] ?? ''
  el.setAttribute('font-family', state.typesets[p.typeset])
  el.setAttribute('font-weight', p.bold ? 700 : p.weight)
  el.setAttribute('font-size', base['font-size'] * p.scale)
  el.setAttribute('x', base.x + p.dx)
  el.setAttribute('y', base.y + p.dy)
  el.setAttribute('fill', p.color || 'currentColor')
  el.classList.toggle('active-drag', active?.kind === 'title' && active.index === i)
}

// --- Save ---

function bake(svg) {
  return svg.replace(/var\(--fg[^)]*\)/g, css_hsl(current.fg))
            .replace(/var\(--bg[^)]*\)/g, css_hsl(current.bg))
            .replace(/var\(--ac[^)]*\)/g, css_hsl(current.ac))
}

function serialize(el) {
  return new XMLSerializer().serializeToString(el)
}

function fit_logo(el) {
  // Clone the tuned logo with its viewBox fitted to the actual content width
  const clone = el.cloneNode(true)
  const box = el.getBBox()
  clone.setAttribute('viewBox', `0 0 ${Math.ceil(box.x + box.width + 8)} 96`)
  return clone
}

function rasterize(svg, px) {
  // Draw the baked SVG onto a canvas at px size and return a PNG data URL
  return new Promise((resolve, reject) => {
    const sized = svg.replace('<svg ', `<svg width="${px}" height="${px}" `)
    const url = URL.createObjectURL(new Blob([sized], { type: 'image/svg+xml' }))
    const img = new Image()
    img.onload = () => {
      const canvas = Object.assign(document.createElement('canvas'), { width: px, height: px })
      canvas.getContext('2d').drawImage(img, 0, 0, px, px)
      URL.revokeObjectURL(url)
      resolve(canvas.toDataURL('image/png'))
    }
    img.onerror = () => reject(new Error('svg rasterization failed'))
    img.src = url
  })
}

async function save_logo() {
  try {
    const cand = state.candidates[selected]
    const icon_src = document.querySelector(`.card[data-index="${selected}"] .panel.light .main svg`)
    const svg_icon = bake(serialize(icon_src))
    const logo_svg_el = document.querySelector('#logo-card .panel.light .main svg')
    const svg_logo = bake(serialize(fit_logo(logo_svg_el)))
    const pngs = { 16: await rasterize(svg_icon, 16), 32: await rasterize(svg_icon, 32) }
    const out = await api('/api/save', {
      index: selected, scheme: current.scheme,
      colors: { fg: css_hsl(current.fg), bg: css_hsl(current.bg) },
      icons: { ...cand.icons, ...chosen[selected] }, svg_icon, svg_logo, pngs,
    })
    status(`Saved: ${out.saved.join(', ')}`)
  } catch (err) {
    status(`Save failed: ${err.message}`)
  }
}

// --- Regenerate / theme / status ---

async function regenerate() {
  const raw = document.getElementById('seed').value.trim()
  const seed = raw && Number.isInteger(+raw) && +raw !== state.seed ? +raw : undefined
  state = await api('/api/regenerate', seed === undefined ? {} : { seed })
  for (const k of Object.keys(chosen)) delete chosen[k]  // fresh icons on regenerate
  render()
  apply_colors()
}

function status(text) {
  const el = document.getElementById('status')
  el.textContent = text
  el.style.display = 'block'
  clearTimeout(status.timer)
  status.timer = setTimeout(() => { el.style.display = 'none' }, 4000)
}

document.getElementById('regen').onclick = () => regenerate().catch(err => status(err.message))
document.getElementById('theme-toggle').onclick = () => {
  const root = document.documentElement
  root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark'
  document.getElementById('theme-toggle').textContent = root.dataset.theme === 'dark' ? '☀' : '☾'
}

// Swap the "mndicon" text for a saved brand logo.svg, if one exists in assets/
fetch('/assets/logo.svg').then(res => {
  if (res.ok) res.text().then(svg => { document.getElementById('brand').innerHTML = svg })
})

api('/api/candidates').then(data => {
  state = data
  set_scheme(state.schemes.find(s => s.name === 'grey'))
  render()
  render_color_rows()
}).catch(err => status(err.message))
</script>
